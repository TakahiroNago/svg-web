server {
    listen 80;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    # Go API health check (GET /healthz) exposed through the same /api/ prefix.
    location = /api/healthz {
        proxy_pass http://api:8080/healthz;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
    }

    location /api/ {
        proxy_pass http://api:8080;
        proxy_http_version 1.1;

        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        # A 20 MiB file plus the multipart overhead the API allows for.
        client_max_body_size 21m;
        # Longer than the API's engine timeout, so its JSON 504 arrives before Nginx gives up.
        proxy_read_timeout 130s;
    }

    location / {
        try_files $uri $uri/ /index.html;
    }
}
