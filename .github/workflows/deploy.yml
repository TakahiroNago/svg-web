name: Deploy SVG Web to AWS

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: svg-web-deploy
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Verify AWS credentials
        env:
          AWS_ACCESS_KEY_ID: ${{ secrets.AWS_ACCESS_KEY_ID }}
          AWS_SECRET_ACCESS_KEY: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          AWS_DEFAULT_REGION: ap-southeast-2
        run: |
          set -eu
          aws sts get-caller-identity

      - name: Deploy to EC2 through SSM
        env:
          AWS_ACCESS_KEY_ID: ${{ secrets.AWS_ACCESS_KEY_ID }}
          AWS_SECRET_ACCESS_KEY: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          AWS_DEFAULT_REGION: ap-southeast-2
        run: |
          set -eu

          INSTANCE_ID="i-0f21053ec32e7d409"

          COMMAND_ID=$(aws ssm send-command \
            --region "$AWS_DEFAULT_REGION" \
            --instance-ids "$INSTANCE_ID" \
            --document-name "AWS-RunShellScript" \
            --parameters 'commands=["set -eu","cd /home/ubuntu/apps/svg-web","sudo -u ubuntu -H git -C /home/ubuntu/apps/svg-web fetch origin main","sudo -u ubuntu -H git -C /home/ubuntu/apps/svg-web switch main","sudo -u ubuntu -H git -C /home/ubuntu/apps/svg-web pull --ff-only origin main","docker compose build web","docker compose up -d --no-deps --force-recreate web","for attempt in $(seq 1 12); do if curl -fsS --max-time 5 http://127.0.0.1:8081/ > /dev/null; then break; fi; sleep 5; done","curl -fsS --max-time 5 http://127.0.0.1:8081/ > /dev/null","curl -fsS --max-time 15 https://aws-svg.art-full-stack.com/ > /dev/null","echo Deployment successful"]' \
            --query 'Command.CommandId' \
            --output text)

          echo "SSM command ID: $COMMAND_ID"

          for attempt in $(seq 1 60); do
            STATUS=$(aws ssm get-command-invocation \
              --region "$AWS_DEFAULT_REGION" \
              --command-id "$COMMAND_ID" \
              --instance-id "$INSTANCE_ID" \
              --query 'Status' \
              --output text 2>/dev/null || true)

            case "$STATUS" in
              Success)
                echo "Deployment successful"
                exit 0
                ;;
              Failed|Cancelled|TimedOut|Cancelling)
                aws ssm get-command-invocation \
                  --region "$AWS_DEFAULT_REGION" \
                  --command-id "$COMMAND_ID" \
                  --instance-id "$INSTANCE_ID" \
                  --query '{Status:Status,Stdout:StandardOutputContent,Stderr:StandardErrorContent}' \
                  --output json || true
                exit 1
                ;;
              *)
                sleep 5
                ;;
            esac
          done

          echo "Timed out waiting for SSM command"
          aws ssm get-command-invocation \
            --region "$AWS_DEFAULT_REGION" \
            --command-id "$COMMAND_ID" \
            --instance-id "$INSTANCE_ID" \
            --query '{Status:Status,Stdout:StandardOutputContent,Stderr:StandardErrorContent}' \
            --output json || true
          exit 1
