services:
  web:
    build:
      context: .
      dockerfile: docker/Dockerfile
      args:
        VITE_API_BASE_URL: ${VITE_API_BASE_URL:-}
    ports:
      - "80:80"
    networks:
      - svg-backend
    restart: unless-stopped

networks:
  svg-backend:
    external: true
    name: svg-app_default
