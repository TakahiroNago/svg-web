services:
  web:
    build:
      context: .
      dockerfile: docker/Dockerfile
      # AWS build: server-side conversion through the Go API on the same origin
      # (docker/nginx.conf proxies /api/ to it). Both values are fixed here rather than
      # read from .env so the AWS build never depends on untracked settings.
      # Cloudflare Pages does not use this file and stays in the default wasm mode.
      args:
        VITE_CONVERTER_MODE: server
        VITE_API_BASE_URL: ""
    ports:
      - "127.0.0.1:8081:80"
    networks:
      - svg-backend
    restart: unless-stopped

networks:
  svg-backend:
    external: true
    name: svg-app_default
